seed: 111
env_init_seed: 1
eval_init_seed: 2

num_train_steps: 5000
num_envs: 128

agent:
  baseline_learning_rate: 0.005
  logZ_learning_rate: 0.1
  gae_lambda: 0.99
  baseline_epochs: 1
  baseline_num_splits: 1
  trpo_delta: 0.01
  cg_iters: 10
  cg_damping: 0.0
  line_search_iters: 20  # was 10: matches reference max_backtracks default
  line_search_shrink: 0.5
  center_advantages: true
  start_eps: 0.0
  end_eps: 0.0
  exploration_steps: 0  # Should be 0
  train_backward: false

network:
  # Input size and output size are computed based on the environment
  hidden_size: 256
  depth: 4

environment:
  reward: "easy"
  dim: 4
  side: 32

metrics:
  n_rounds : 10
  batch_size: 1024

logging:
  track_each: 1000 # in terms of total training steps, not divided by num_envs
  eval_each: 100 # in terms of total training steps, not divided by num_envs
  metric_buffer_size: 200000
  tqdm_print_rate: 20
  use_writer: true
  log_dir: null # If null, dir will be automatically created
  checkpoint_dir: null # If null, dir will be automatically created
# Technical information for writer
writer:
  writer_type: comet_ml # wandb, trackio or null (no logging online)
  save_locally: true # Save metrics locally or not
  entity: azykova-myzina
  project: hypergrid
  offline_directory: ./comet_offline_logs

# Technical information for hydra
hydra:
  run:
    dir: ./tmp/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./tmp/${now:%Y-%m-%d}/${now:%H-%M-%S}
